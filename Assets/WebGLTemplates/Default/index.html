<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>Blockchain Game</title>
    <style>
        body { margin: 0; background: #222; }
        #unity-container { width: 100%; height: 100%; }
        #unity-canvas { width: 100%; height: 100%; background: #000; }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.8.0/dist/web3.min.js"></script>

    <script>
        var unityInstance;
        var canvas = document.querySelector("#unity-canvas");
        var buildUrl = "Build";
        var config = {
            dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
            frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
            codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
            memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
            symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
            streamingAssetsUrl: "StreamingAssets",
            companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
            productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
            productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        };

        var script = document.createElement("script");
        script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                console.log('로딩:', Math.round(progress * 100) + '%');
            }).then((instance) => {
                unityInstance = instance;
                console.log('[Unity] 로드 완료');
            }).catch((err) => {
                alert('Unity 로드 실패: ' + err);
            });
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
